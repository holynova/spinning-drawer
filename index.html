    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        /* 婊氬姩鏉＄編鍖?*/
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        .slider-thumb::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        canvas {
            touch-action: none;
        }
        :root {
            --bg-base: #f5f5f7;
            --bg-surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0066cc;
            --accent-blue-hover: #0077ed;
            --border-light: #d2d2d7;
            --apple-gray: #e5e5ea;
            --sf-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            --sf-text: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
            --ease-standard: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            letter-spacing: 0;
        }

        body {
            margin: 0;
            font-family: var(--sf-text);
            background: var(--bg-base);
            color: var(--text-primary);
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .global-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 44px;
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(20px);
        }

        .nav-inner {
            max-width: 1024px;
            height: 44px;
            margin: 0 auto;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-title {
            font-family: var(--sf-display);
            font-size: 17px;
            line-height: 1.2;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .brand-subtitle {
            display: none;
        }

        .mode-control {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border: 1px solid var(--apple-gray);
            border-radius: 999px;
            background: rgba(245, 245, 247, 0.82);
        }

        .mode-btn {
            min-width: 92px;
            padding: 5px 13px;
            border: 0;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1.25;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            transition: color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .mode-btn-active {
            color: #fff;
            background: var(--accent-blue);
        }

        .app-shell {
            max-width: 1024px;
            margin: 0 auto;
            padding: 42px 22px 56px;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(300px, 0.82fr);
            gap: 20px;
        }

        .visual-column,
        .controls-column {
            min-width: 0;
        }

        .visual-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-panel {
            position: relative;
            overflow: hidden;
            height: min(62vh, 590px);
            min-height: 480px;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            background: var(--bg-surface);
        }

        .legend-panel,
        .glass-button {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(210, 210, 215, 0.9);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }

        .legend-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;
            padding: 12px 14px;
            border-radius: 18px;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-secondary);
            pointer-events: none;
            user-select: none;
        }

        .legend-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-line + .legend-line {
            margin-top: 5px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            flex: 0 0 auto;
        }

        .action-stack {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .glass-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            color: var(--accent-blue);
            font-size: 12px;
            line-height: 1.2;
            font-weight: 600;
            transition: transform 200ms var(--ease-standard), color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .glass-button:hover {
            color: var(--accent-blue-hover);
            background: rgba(255, 255, 255, 0.94);
            transform: scale(1.02);
        }

        .history-strip,
        .control-card,
        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 18px;
        }

        .history-strip {
            padding: 20px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 14px;
            font-family: var(--sf-display);
            font-size: 17px;
            line-height: 1.2;
            font-weight: 600;
        }

        .link-button {
            color: var(--accent-blue);
            font-size: 13px;
            line-height: 1.3;
            font-weight: 500;
        }

        .link-button:hover {
            color: var(--accent-blue-hover);
            text-decoration: underline;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 88px);
            overflow-y: auto;
            padding-right: 2px;
        }

        .control-card,
        .info-card {
            padding: 24px;
        }

        .control-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 20px;
            font-family: var(--sf-display);
            font-size: 24px;
            line-height: 1.15;
            font-weight: 600;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .field-block {
            min-width: 0;
        }

        .field-label,
        .slider-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.35;
            font-weight: 600;
        }

        .apple-select {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fbfbfd;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.35;
            padding: 8px 11px;
            outline: none;
            transition: border-color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .apple-select:focus {
            border-color: var(--accent-blue);
            background: #fff;
        }

        .control-divider {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--apple-gray);
        }

        .slider-row {
            margin-top: 18px;
        }

        .slider-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .slider-value {
            min-width: 34px;
            text-align: right;
            color: var(--accent-blue);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.4;
            font-weight: 500;
        }

        .number-input {
            width: 76px;
            min-height: 30px;
            border: 1px solid var(--apple-gray);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.76);
            color: var(--text-primary);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.2;
            text-align: right;
            padding: 4px 8px;
            outline: none;
        }

        .number-input:focus {
            border-color: var(--accent-blue);
            background: var(--bg-surface);
        }

        body.dark-mode .number-input {
            background: rgba(44, 44, 46, 0.82);
        }

        .slider-thumb {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: var(--apple-gray);
            appearance: none;
        }

        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.14);
            cursor: pointer;
            border-radius: 50%;
        }

        .slider-thumb::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.14);
            cursor: pointer;
            border-radius: 50%;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 22px;
        }

        .soft-button,
        .blue-button {
            min-height: 38px;
            border-radius: 999px;
            font-size: 14px;
            line-height: 1.25;
            font-weight: 500;
            transition: transform 200ms var(--ease-standard), background 200ms var(--ease-standard), color 200ms var(--ease-standard);
        }

        .soft-button {
            background: var(--apple-gray);
            color: var(--text-primary);
        }

        .blue-button {
            background: var(--accent-blue);
            color: #fff;
        }

        .soft-button:hover,
        .blue-button:hover {
            transform: scale(1.02);
        }

        .blue-button:hover {
            background: var(--accent-blue-hover);
        }

        .info-title {
            margin: 0 0 8px;
            font-family: var(--sf-display);
            font-size: 24px;
            line-height: 1.15;
            font-weight: 600;
        }

        .info-copy {
            margin: 0 0 14px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.47;
        }

        .tip-box {
            padding: 12px 13px;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fbfbfd;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.45;
        }

        #history-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
            scroll-snap-type: x mandatory;
        }

        .history-empty {
            padding: 16px 2px;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        .history-card {
            flex: 0 0 112px;
            overflow: hidden;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 200ms var(--ease-standard), border-color 200ms var(--ease-standard);
        }

        .history-card:hover {
            border-color: var(--accent-blue);
            transform: scale(1.02);
        }

        .history-card img {
            width: 100%;
            height: 66px;
            object-fit: contain;
            padding: 4px;
        }

        .history-card-meta {
            padding: 6px;
            border-top: 1px solid var(--apple-gray);
            color: var(--text-secondary);
            font-size: 10px;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .controls-column {
                max-height: none;
                overflow: visible;
            }
        }

        @media (max-width: 734px) {
            .nav-inner {
                padding: 0 14px;
            }

            .brand-title {
                font-size: 14px;
            }

            .mode-btn {
                min-width: auto;
                padding: 5px 10px;
            }

            .app-shell {
                padding: 24px 14px 40px;
            }

            .canvas-panel {
                min-height: 390px;
                height: 58vh;
                border-radius: 22px;
            }

            .field-grid,
            .button-row {
                grid-template-columns: 1fr;
            }

            .action-stack {
                top: auto;
                right: 14px;
                bottom: 14px;
            }
        }

        body.full-canvas-app {
            height: 100vh;
            overflow: hidden;
            background: #f5f5f7;
        }

        body.dark-mode {
            --bg-base: #111318;
            --bg-surface: #1c1f26;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --border-light: #3a3a3c;
            --apple-gray: #2c2c2e;
        }

        .workspace {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #f5f5f7;
        }

        body.dark-mode .workspace {
            background: #111318;
        }

        .canvas-stage {
            position: absolute;
            inset: 0;
            background: #fff;
        }

        body.dark-mode .canvas-stage {
            background: #12151b;
        }

        .canvas-stage canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            user-select: none;
        }

        .canvas-stage canvas.is-panning {
            cursor: grabbing;
        }

        .brand-floating {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            font-family: var(--sf-display);
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent-blue);
            box-shadow: 0 12px 28px rgba(0, 102, 204, 0.22);
        }

        .floating-panel {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 30;
            width: min(336px, calc(100vw - 36px));
            max-height: calc(100vh - 36px);
            overflow: hidden;
            border: 1px solid rgba(210, 210, 215, 0.92);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(24px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.1);
            transition: width 240ms var(--ease-standard), border-radius 240ms var(--ease-standard);
        }

        body.dark-mode .floating-panel,
        body.dark-mode .history-dock {
            background: rgba(29, 29, 31, 0.76);
            border-color: rgba(84, 84, 88, 0.85);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
        }

        .floating-panel.is-collapsed {
            width: 56px;
            border-radius: 999px;
        }

        .panel-header {
            min-height: 48px;
            padding: 0 8px 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid rgba(210, 210, 215, 0.72);
        }

        .panel-title {
            margin: 0;
            font-family: var(--sf-display);
            font-size: 16px;
            line-height: 1.2;
            font-weight: 600;
            white-space: nowrap;
        }

        .panel-toggle {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: var(--text-primary);
            background: var(--apple-gray);
            transition: background 200ms var(--ease-standard), transform 200ms var(--ease-standard);
        }

        .panel-toggle:hover {
            background: #d8d8de;
            transform: scale(1.03);
        }

        .floating-panel.is-collapsed .panel-title,
        .floating-panel.is-collapsed .panel-content {
            display: none;
        }

        .floating-panel.is-collapsed .panel-header {
            padding: 10px;
            border-bottom: 0;
        }

        .floating-panel.is-collapsed .panel-toggle svg {
            transform: rotate(180deg);
        }

        .panel-content {
            max-height: calc(100vh - 84px);
            overflow-y: auto;
            padding: 0 12px;
        }

        .panel-section {
            padding: 12px 0;
            border-top: 1px solid rgba(210, 210, 215, 0.72);
        }

        .panel-section:first-child {
            border-top: 0;
            padding-top: 10px;
        }

        .panel-section-title {
            margin: 0 0 8px;
            color: var(--text-secondary);
            font-size: 10px;
            line-height: 1.3;
            font-weight: 700;
            text-transform: uppercase;
        }

        .segmented-radio,
        .shape-grid,
        .color-grid {
            display: grid;
            gap: 6px;
        }

        .segmented-radio {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mode-option,
        .interface-option,
        .shape-option,
        .color-option {
            position: relative;
            display: block;
        }

        .mode-option input,
        .interface-option input,
        .shape-option input,
        .color-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .mode-pill,
        .interface-pill,
        .shape-tile,
        .color-tile {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--apple-gray);
            background: rgba(255, 255, 255, 0.78);
            color: var(--text-primary);
            transition: border-color 200ms var(--ease-standard), background 200ms var(--ease-standard), color 200ms var(--ease-standard), transform 200ms var(--ease-standard);
        }

        .mode-pill span,
        .interface-pill,
        .shape-tile span,
        .color-tile span,
        .panel-action {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        body.dark-mode .mode-pill,
        body.dark-mode .interface-pill,
        body.dark-mode .shape-tile,
        body.dark-mode .color-tile {
            background: rgba(44, 44, 46, 0.82);
        }

        .mode-pill,
        .interface-pill {
            min-height: 34px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }

        .interface-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .micro-control {
            min-width: 0;
        }

        .micro-control-label {
            display: block;
            margin: 0 0 5px;
            color: var(--text-secondary);
            font-size: 10px;
            line-height: 1.2;
            font-weight: 700;
            text-transform: uppercase;
        }

        .micro-control .segmented-radio {
            gap: 4px;
        }

        .micro-control .interface-pill {
            min-height: 26px;
            font-size: 10px;
        }

        .mode-pill svg {
            width: 30px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            flex: 0 0 auto;
        }

        .mode-option input:checked + .mode-pill,
        .interface-option input:checked + .interface-pill {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .shape-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .shape-tile {
            min-height: 54px;
            flex-direction: column;
            gap: 4px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .shape-tile svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .shape-option input:checked + .shape-tile,
        .color-option input:checked + .color-tile {
            border-color: var(--accent-blue);
            background: rgba(0, 102, 204, 0.08);
            color: var(--accent-blue);
        }

        .shape-tile:hover,
        .color-tile:hover,
        .mode-pill:hover,
        .interface-pill:hover {
            transform: scale(1.015);
        }

        .color-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .color-tile {
            min-height: 30px;
            border-radius: 9px;
            gap: 5px;
            font-size: 10px;
            font-weight: 600;
        }

        .swatch {
            width: 11px;
            height: 11px;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            flex: 0 0 auto;
        }

        .range-control + .range-control {
            margin-top: 10px;
        }

        .range-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 12px;
        }

        .range-grid .range-control + .range-control {
            margin-top: 0;
        }

        .range-grid .slider-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slider-meta {
            margin-bottom: 5px;
        }

        .slider-label {
            margin-bottom: 0;
            font-size: 11px;
            line-height: 1.25;
        }

        .number-input {
            width: 58px;
            min-height: 24px;
            border-radius: 7px;
            font-size: 11px;
            padding: 2px 6px;
        }

        .inline-controls {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex: 0 0 auto;
        }

        .mini-reset {
            min-height: 24px;
            padding: 0 7px;
            border-radius: 7px;
            background: var(--apple-gray);
            color: var(--text-primary);
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 700;
        }

        .slider-thumb {
            height: 3px;
        }

        .slider-thumb::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
        }

        .slider-thumb::-moz-range-thumb {
            width: 16px;
            height: 16px;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }

        .panel-action {
            min-height: 30px;
            border-radius: 9px;
            background: var(--apple-gray);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            transition: transform 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .range-control > .panel-action {
            width: 100%;
        }

        .panel-section:last-child {
            position: sticky;
            bottom: 0;
            z-index: 2;
            margin: 0 -12px;
            padding: 8px 12px 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
        }

        body.dark-mode .panel-section:last-child {
            background: rgba(29, 29, 31, 0.92);
        }

        .panel-action.primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .panel-action:hover {
            transform: scale(1.02);
        }

        .snapshot-preview {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(17, 19, 24, 0.58);
            backdrop-filter: blur(18px);
        }

        .snapshot-card {
            width: min(720px, calc(100vw - 48px));
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(210, 210, 215, 0.72);
            border-radius: 16px;
            background: var(--bg-surface);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
        }

        .snapshot-toolbar {
            min-height: 44px;
            padding: 8px 10px 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--border-light);
        }

        .snapshot-title {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .snapshot-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .snapshot-button {
            min-height: 28px;
            padding: 0 10px;
            border-radius: 8px;
            background: var(--apple-gray);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 700;
        }

        .snapshot-button.primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .snapshot-card img {
            display: block;
            width: 100%;
            height: auto;
            max-height: calc(100vh - 116px);
            object-fit: contain;
            background: #12151b;
        }

        .history-dock {
            display: none;
            position: fixed;
            left: 24px;
            bottom: 22px;
            z-index: 25;
            width: min(520px, calc(100vw - 48px));
            padding: 12px 14px;
            border: 1px solid rgba(210, 210, 215, 0.92);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.1);
        }

        .history-dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-dock-title {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .history-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-dock.is-collapsed {
            width: auto;
            min-width: 164px;
        }

        .history-dock.is-collapsed .history-dock-header {
            margin-bottom: 0;
        }

        .history-dock.is-collapsed #history-container,
        .history-dock.is-collapsed .history-clear {
            display: none;
        }

        #history-toggle[aria-expanded="false"] {
            transform: rotate(180deg);
        }

        @media (max-width: 760px) {
            .brand-floating {
                top: 14px;
                left: 14px;
            }

            .floating-panel {
                top: 58px;
                right: 12px;
                width: calc(100vw - 24px);
                max-height: calc(100vh - 82px);
            }

            .floating-panel.is-collapsed {
                width: 56px;
            }

            .panel-content {
                max-height: calc(100vh - 146px);
            }

            .shape-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }

            .color-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .history-dock {
                left: 12px;
                bottom: 12px;
                width: calc(100vw - 24px);
            }
        }
    </style>
