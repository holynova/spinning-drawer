<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Drawer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        /* 婊氬姩鏉＄編鍖?*/
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        .slider-thumb::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        canvas {
            touch-action: none;
        }
        :root {
            --bg-base: #f5f5f7;
            --bg-surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0066cc;
            --accent-blue-hover: #0077ed;
            --border-light: #d2d2d7;
            --apple-gray: #e5e5ea;
            --sf-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            --sf-text: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
            --ease-standard: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            letter-spacing: 0;
        }

        body {
            margin: 0;
            font-family: var(--sf-text);
            background: var(--bg-base);
            color: var(--text-primary);
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .global-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 44px;
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(20px);
        }

        .nav-inner {
            max-width: 1024px;
            height: 44px;
            margin: 0 auto;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-title {
            font-family: var(--sf-display);
            font-size: 17px;
            line-height: 1.2;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .brand-subtitle {
            display: none;
        }

        .mode-control {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border: 1px solid var(--apple-gray);
            border-radius: 999px;
            background: rgba(245, 245, 247, 0.82);
        }

        .mode-btn {
            min-width: 92px;
            padding: 5px 13px;
            border: 0;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1.25;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            transition: color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .mode-btn-active {
            color: #fff;
            background: var(--accent-blue);
        }

        .app-shell {
            max-width: 1024px;
            margin: 0 auto;
            padding: 42px 22px 56px;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(300px, 0.82fr);
            gap: 20px;
        }

        .visual-column,
        .controls-column {
            min-width: 0;
        }

        .visual-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-panel {
            position: relative;
            overflow: hidden;
            height: min(62vh, 590px);
            min-height: 480px;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            background: var(--bg-surface);
        }

        .legend-panel,
        .glass-button {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(210, 210, 215, 0.9);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }

        .legend-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;
            padding: 12px 14px;
            border-radius: 18px;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-secondary);
            pointer-events: none;
            user-select: none;
        }

        .legend-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-line + .legend-line {
            margin-top: 5px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            flex: 0 0 auto;
        }

        .action-stack {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .glass-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            color: var(--accent-blue);
            font-size: 12px;
            line-height: 1.2;
            font-weight: 600;
            transition: transform 200ms var(--ease-standard), color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .glass-button:hover {
            color: var(--accent-blue-hover);
            background: rgba(255, 255, 255, 0.94);
            transform: scale(1.02);
        }

        .history-strip,
        .control-card,
        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 18px;
        }

        .history-strip {
            padding: 20px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 14px;
            font-family: var(--sf-display);
            font-size: 17px;
            line-height: 1.2;
            font-weight: 600;
        }

        .link-button {
            color: var(--accent-blue);
            font-size: 13px;
            line-height: 1.3;
            font-weight: 500;
        }

        .link-button:hover {
            color: var(--accent-blue-hover);
            text-decoration: underline;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 88px);
            overflow-y: auto;
            padding-right: 2px;
        }

        .control-card,
        .info-card {
            padding: 24px;
        }

        .control-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 20px;
            font-family: var(--sf-display);
            font-size: 24px;
            line-height: 1.15;
            font-weight: 600;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .field-block {
            min-width: 0;
        }

        .field-label,
        .slider-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.35;
            font-weight: 600;
        }

        .apple-select {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fbfbfd;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.35;
            padding: 8px 11px;
            outline: none;
            transition: border-color 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .apple-select:focus {
            border-color: var(--accent-blue);
            background: #fff;
        }

        .control-divider {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--apple-gray);
        }

        .slider-row {
            margin-top: 18px;
        }

        .slider-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .slider-value {
            min-width: 34px;
            text-align: right;
            color: var(--accent-blue);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.4;
            font-weight: 500;
        }

        .number-input {
            width: 76px;
            min-height: 30px;
            border: 1px solid var(--apple-gray);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.76);
            color: var(--text-primary);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.2;
            text-align: right;
            padding: 4px 8px;
            outline: none;
        }

        .number-input:focus {
            border-color: var(--accent-blue);
            background: var(--bg-surface);
        }

        body.dark-mode .number-input {
            background: rgba(44, 44, 46, 0.82);
        }

        .slider-thumb {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: var(--apple-gray);
            appearance: none;
        }

        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.14);
            cursor: pointer;
            border-radius: 50%;
        }

        .slider-thumb::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.14);
            cursor: pointer;
            border-radius: 50%;
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 22px;
        }

        .soft-button,
        .blue-button {
            min-height: 38px;
            border-radius: 999px;
            font-size: 14px;
            line-height: 1.25;
            font-weight: 500;
            transition: transform 200ms var(--ease-standard), background 200ms var(--ease-standard), color 200ms var(--ease-standard);
        }

        .soft-button {
            background: var(--apple-gray);
            color: var(--text-primary);
        }

        .blue-button {
            background: var(--accent-blue);
            color: #fff;
        }

        .soft-button:hover,
        .blue-button:hover {
            transform: scale(1.02);
        }

        .blue-button:hover {
            background: var(--accent-blue-hover);
        }

        .info-title {
            margin: 0 0 8px;
            font-family: var(--sf-display);
            font-size: 24px;
            line-height: 1.15;
            font-weight: 600;
        }

        .info-copy {
            margin: 0 0 14px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.47;
        }

        .tip-box {
            padding: 12px 13px;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fbfbfd;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.45;
        }

        #history-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
            scroll-snap-type: x mandatory;
        }

        .history-empty {
            padding: 16px 2px;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        .history-card {
            flex: 0 0 112px;
            overflow: hidden;
            border: 1px solid var(--apple-gray);
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 200ms var(--ease-standard), border-color 200ms var(--ease-standard);
        }

        .history-card:hover {
            border-color: var(--accent-blue);
            transform: scale(1.02);
        }

        .history-card img {
            width: 100%;
            height: 66px;
            object-fit: contain;
            padding: 4px;
        }

        .history-card-meta {
            padding: 6px;
            border-top: 1px solid var(--apple-gray);
            color: var(--text-secondary);
            font-size: 10px;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .controls-column {
                max-height: none;
                overflow: visible;
            }
        }

        @media (max-width: 734px) {
            .nav-inner {
                padding: 0 14px;
            }

            .brand-title {
                font-size: 14px;
            }

            .mode-btn {
                min-width: auto;
                padding: 5px 10px;
            }

            .app-shell {
                padding: 24px 14px 40px;
            }

            .canvas-panel {
                min-height: 390px;
                height: 58vh;
                border-radius: 22px;
            }

            .field-grid,
            .button-row {
                grid-template-columns: 1fr;
            }

            .action-stack {
                top: auto;
                right: 14px;
                bottom: 14px;
            }
        }

        body.full-canvas-app {
            height: 100vh;
            overflow: hidden;
            background: #f5f5f7;
        }

        body.dark-mode {
            --bg-base: #000000;
            --bg-surface: #1d1d1f;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --border-light: #3a3a3c;
            --apple-gray: #2c2c2e;
        }

        .workspace {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #f5f5f7;
        }

        .canvas-stage {
            position: absolute;
            inset: 0;
            background: #fff;
        }

        body.dark-mode .canvas-stage {
            background: #0b0b0d;
        }

        .canvas-stage canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            user-select: none;
        }

        .canvas-stage canvas.is-panning {
            cursor: grabbing;
        }

        .brand-floating {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            font-family: var(--sf-display);
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent-blue);
            box-shadow: 0 12px 28px rgba(0, 102, 204, 0.22);
        }

        .floating-panel {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 30;
            width: min(380px, calc(100vw - 36px));
            max-height: calc(100vh - 36px);
            overflow: hidden;
            border: 1px solid rgba(210, 210, 215, 0.92);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(26px);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.11);
            transition: width 240ms var(--ease-standard), border-radius 240ms var(--ease-standard);
        }

        body.dark-mode .floating-panel,
        body.dark-mode .history-dock {
            background: rgba(29, 29, 31, 0.76);
            border-color: rgba(84, 84, 88, 0.85);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
        }

        .floating-panel.is-collapsed {
            width: 56px;
            border-radius: 999px;
        }

        .panel-header {
            min-height: 56px;
            padding: 0 10px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .panel-title {
            margin: 0;
            font-family: var(--sf-display);
            font-size: 18px;
            line-height: 1.2;
            font-weight: 600;
            white-space: nowrap;
        }

        .panel-toggle {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: var(--text-primary);
            background: var(--apple-gray);
            transition: background 200ms var(--ease-standard), transform 200ms var(--ease-standard);
        }

        .panel-toggle:hover {
            background: #d8d8de;
            transform: scale(1.03);
        }

        .floating-panel.is-collapsed .panel-title,
        .floating-panel.is-collapsed .panel-content {
            display: none;
        }

        .floating-panel.is-collapsed .panel-header {
            padding: 10px;
        }

        .floating-panel.is-collapsed .panel-toggle svg {
            transform: rotate(180deg);
        }

        .panel-content {
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 0 18px 18px;
        }

        .panel-section {
            padding: 18px 0;
            border-top: 1px solid rgba(210, 210, 215, 0.8);
        }

        .panel-section:first-child {
            border-top: 0;
            padding-top: 4px;
        }

        .panel-section-title {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 11px;
            line-height: 1.3;
            font-weight: 700;
            text-transform: uppercase;
        }

        .segmented-radio,
        .shape-grid,
        .color-grid {
            display: grid;
            gap: 8px;
        }

        .segmented-radio {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mode-option,
        .interface-option,
        .shape-option,
        .color-option {
            position: relative;
            display: block;
        }

        .mode-option input,
        .interface-option input,
        .shape-option input,
        .color-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .mode-pill,
        .interface-pill,
        .shape-tile,
        .color-tile {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--apple-gray);
            background: rgba(255, 255, 255, 0.78);
            color: var(--text-primary);
            transition: border-color 200ms var(--ease-standard), background 200ms var(--ease-standard), color 200ms var(--ease-standard), transform 200ms var(--ease-standard);
        }

        body.dark-mode .mode-pill,
        body.dark-mode .interface-pill,
        body.dark-mode .shape-tile,
        body.dark-mode .color-tile {
            background: rgba(44, 44, 46, 0.82);
        }

        .mode-pill,
        .interface-pill {
            min-height: 40px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            gap: 8px;
        }

        .mode-pill svg {
            width: 36px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            flex: 0 0 auto;
        }

        .mode-option input:checked + .mode-pill,
        .interface-option input:checked + .interface-pill {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .shape-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .shape-tile {
            min-height: 78px;
            flex-direction: column;
            gap: 7px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
        }

        .shape-tile svg {
            width: 34px;
            height: 34px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .shape-option input:checked + .shape-tile,
        .color-option input:checked + .color-tile {
            border-color: var(--accent-blue);
            background: rgba(0, 102, 204, 0.08);
            color: var(--accent-blue);
        }

        .shape-tile:hover,
        .color-tile:hover,
        .mode-pill:hover,
        .interface-pill:hover {
            transform: scale(1.015);
        }

        .color-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .color-tile {
            min-height: 38px;
            border-radius: 999px;
            gap: 7px;
            font-size: 11px;
            font-weight: 600;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            flex: 0 0 auto;
        }

        .range-control + .range-control {
            margin-top: 16px;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .panel-action {
            min-height: 38px;
            border-radius: 999px;
            background: var(--apple-gray);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            transition: transform 200ms var(--ease-standard), background 200ms var(--ease-standard);
        }

        .panel-action.primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .panel-action:hover {
            transform: scale(1.02);
        }

        .history-dock {
            position: fixed;
            left: 24px;
            bottom: 22px;
            z-index: 25;
            width: min(520px, calc(100vw - 48px));
            padding: 12px 14px;
            border: 1px solid rgba(210, 210, 215, 0.92);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.1);
        }

        .history-dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-dock-title {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .history-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-dock.is-collapsed {
            width: auto;
            min-width: 164px;
        }

        .history-dock.is-collapsed .history-dock-header {
            margin-bottom: 0;
        }

        .history-dock.is-collapsed #history-container,
        .history-dock.is-collapsed .history-clear {
            display: none;
        }

        #history-toggle[aria-expanded="false"] {
            transform: rotate(180deg);
        }

        @media (max-width: 760px) {

        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            panelToggle.addEventListener('click', toggleParamsPanel);
            historyToggle.addEventListener('click', toggleHistoryDock);
            canvas.addEventListener('pointerdown', handleCanvasPointerDown);
            canvas.addEventListener('pointermove', handleCanvasPointerMove);
            canvas.addEventListener('pointerup', handleCanvasPointerUp);
            canvas.addEventListener('pointercancel', handleCanvasPointerUp);
            canvas.addEventListener('wheel', handleCanvasWheel, { passive: false });
            
            ['R', 'r', 'd', 'speed', 'lineWidth', 'zoom'].forEach(key => {
                inputs[key].addEventListener('input', (e) => updateNumericParam(key, e.target.value));
                displays[key].addEventListener('input', (e) => updateNumericParam(key, e.target.value));
                displays[key].addEventListener('change', () => updateDisplay(key));
            });

            inputs.language.forEach(input => {
                input.addEventListener('change', (e) => {
                    state.language = e.target.value;
                    applyLanguage();
                    updateHistoryUI();
                });
            });

            inputs.theme.forEach(input => {
                input.addEventListener('change', (e) => {
                    state.theme = e.target.value;
                    applyTheme();
                });
            });

            inputs.mode.forEach(input => {
                input.addEventListener('change', (e) => setMode(e.target.value));
            });

            inputs.color.forEach(input => {
                input.addEventListener('change', (e) => {
                    state.colorScheme = e.target.value;
                    markPathLayerDirty();
                });
            });

            inputs.statorShape.forEach(input => {
                input.addEventListener('change', (e) => {
                    state.statorShape = e.target.value;
                    if (state.statorShape === 'ellipse') buildEllipseLUT();
                    resetPath();
                });
            });

            inputs.rotorShape.forEach(input => {
                input.addEventListener('change', (e) => {
                    state.rotorShape = e.target.value;
                    resetPath();
                });
            });

            syncControlsFromState();
            applyTheme();
            applyLanguage();
            loadHistoryFromStorage();
            updateHistoryUI();
            animate();
        }

        function loadHistoryFromStorage() {
            try {
                const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return;
                state.history = parsed
                    .filter(item => item && item.id && item.img && item.config)
                    .slice(0, MAX_HISTORY_ITEMS);
            } catch (error) {
                console.warn('Unable to load drawing history', error);
                state.history = [];
            }
        }

        function persistHistoryToStorage() {
            try {
                const payload = state.history.slice(0, MAX_HISTORY_ITEMS).map(item => ({
                    id: item.id,
                    img: item.img,
                    config: item.config
                }));
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(payload));
            } catch (error) {
                console.warn('Unable to save drawing history', error);
            }
        }

        function toggleParamsPanel() {
            const collapsed = paramsPanel.classList.toggle('is-collapsed');
            panelToggle.setAttribute('aria-expanded', String(!collapsed));
            panelToggle.setAttribute('aria-label', t(collapsed ? 'expandParams' : 'collapseParams'));
        }

        function toggleHistoryDock() {
            const collapsed = historyDock.classList.toggle('is-collapsed');
            historyToggle.setAttribute('aria-expanded', String(!collapsed));
            historyToggle.setAttribute('aria-label', t(collapsed ? 'expandHistory' : 'collapseHistory'));
        }

        function handleCanvasPointerDown(e) {
            if (e.button !== undefined && e.button !== 0) return;
            state.isPanning = true;
            state.panStartX = e.clientX;
            state.panStartY = e.clientY;
            state.panOriginX = state.panX;
            state.panOriginY = state.panY;
            canvas.classList.add('is-panning');
            canvas.setPointerCapture?.(e.pointerId);
        }

        function handleCanvasPointerMove(e) {
            if (!state.isPanning) return;
            state.panX = state.panOriginX + (e.clientX - state.panStartX);
            state.panY = state.panOriginY + (e.clientY - state.panStartY);
            markPathLayerDirty();
        }

        function handleCanvasPointerUp(e) {
            if (!state.isPanning) return;
            state.isPanning = false;
            canvas.classList.remove('is-panning');
            canvas.releasePointerCapture?.(e.pointerId);
        }

        function handleCanvasWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pointerX = e.clientX - rect.left - rect.width / 2;
            const pointerY = e.clientY - rect.top - rect.height / 2;
            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            setZoomAroundCanvasPoint(state.zoom * zoomFactor, pointerX, pointerY);
        }

        function setZoomAroundCanvasPoint(nextZoom, anchorX, anchorY) {
            const oldZoom = state.zoom;
            nextZoom = Math.min(4.4, Math.max(0.4, nextZoom));
            if (Math.abs(nextZoom - oldZoom) < 0.001) return;

            const worldX = (anchorX - state.panX) / oldZoom;
            const worldY = (anchorY - state.panY) / oldZoom;
            state.zoom = nextZoom;
            state.panX = anchorX - worldX * nextZoom;
            state.panY = anchorY - worldY * nextZoom;
            updateDisplay('zoom');
            markPathLayerDirty();
        }

        function clampToInput(key, value) {
            const input = inputs[key];
            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            if (!Number.isFinite(value)) return null;
            if (Number.isFinite(min)) value = Math.max(min, value);
            if (Number.isFinite(max)) value = Math.min(max, value);
            return value;
        }

        function updateNumericParam(key, rawValue) {
            let val = ['lineWidth', 'zoom'].includes(key) ? parseFloat(rawValue) : parseInt(rawValue, 10);
            val = clampToInput(key, val);
            if (val === null) return;

            if (key === 'zoom') {
                setZoomAroundCanvasPoint(val / 100, 0, 0);
                return;
            }

            state[key] = val;
            updateDisplay(key);
            if (key === 'R' && state.statorShape === 'ellipse') buildEllipseLUT();
            if (key === 'lineWidth') markPathLayerDirty();
            if (!['speed', 'lineWidth'].includes(key)) resetPath();
        }

        function setCheckedRadio(name, value) {
            const input = document.querySelector(`input[name="${name}"][value="${value}"]`);
            if (input) input.checked = true;
        }

        function updateDisplay(key) {
            if (!displays[key]) return;
            if (key === 'zoom') {
                const zoomValue = Math.round(state.zoom * 20) * 5;
                inputs.zoom.value = zoomValue;
                displays.zoom.value = zoomValue;
            } else {
                inputs[key].value = state[key];
                displays[key].value = key === 'lineWidth' ? state[key].toFixed(1) : state[key];
            }
        }

        function t(key) {
            return translations[state.language][key] || translations.en[key] || key;
        }

        function applyLanguage() {
            document.documentElement.lang = state.language === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            panelToggle.setAttribute('aria-label', t(paramsPanel.classList.contains('is-collapsed') ? 'expandParams' : 'collapseParams'));
            historyToggle.setAttribute('aria-label', t(historyDock.classList.contains('is-collapsed') ? 'expandHistory' : 'collapseHistory'));
        }

        function applyTheme() {
            document.body.classList.toggle('dark-mode', state.theme === 'dark');
        }

        function syncControlsFromState() {
            inputs.R.value = state.R;
            inputs.r.value = state.r;
            inputs.d.value = state.d;
            inputs.speed.value = state.speed;
            inputs.lineWidth.value = state.lineWidth;
            inputs.zoom.value = Math.round(state.zoom * 20) * 5;
            ['R', 'r', 'd', 'speed', 'lineWidth', 'zoom'].forEach(updateDisplay);
            setCheckedRadio('language', state.language);
            setCheckedRadio('theme', state.theme);
            setCheckedRadio('mode', state.mode);
            setCheckedRadio('colorScheme', state.colorScheme);
            setCheckedRadio('statorShape', state.statorShape);
            setCheckedRadio('rotorShape', state.rotorShape);
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            pathCanvas.width = canvas.width;
            pathCanvas.height = canvas.height;
            markPathLayerDirty();
        }

        function resetPath() {
            state.totalDistance = 0;
            state.pathPoints = [];
            state.isRunning = true;
            clearPathLayer();
        }

        function setMode(mode) {
            state.mode = mode;
            setCheckedRadio('mode', mode);
            resetPath();
        }
        function handleReset() {
            if (state.pathPoints.length > 200) saveToHistory();
            resetPath();
        }

        function resetView() {
            state.zoom = 1;
            state.panX = DEFAULT_PAN_X;
            state.panY = DEFAULT_PAN_Y;
            updateDisplay('zoom');
            markPathLayerDirty();
        }

        function handleRandomize() {
            if (state.pathPoints.length > 200) saveToHistory();
            
            state.R = Math.floor(Math.random() * 100) + 40;
            state.r = Math.floor(Math.random() * 50) + 15;
            state.d = Math.floor(Math.random() * 100) + 10;
            state.lineWidth = (Math.floor(Math.random() * 7) + 2) / 2;
            state.zoom = 1;
            state.panX = 0;
            state.panY = 0;
            
            const shapes = ['circle', 'ellipse', 'track', 'triangle', 'square', 'pentagon', 'hexagon', 'heptagon', 'octagon', 'diamond'];
            state.statorShape = shapes[Math.floor(Math.random() * shapes.length)]; 
            const rotorShapes = ['circle', 'triangle', 'square', 'pentagon', 'hexagon', 'octagon'];
            state.rotorShape = rotorShapes[Math.floor(Math.random() * rotorShapes.length)];
            
            if (state.statorShape === 'ellipse') buildEllipseLUT();

            const colors = ['classic', 'rainbow', 'sunset', 'ocean', 'neon', 'warm', 'grape', 'aurora', 'fire', 'ice'];
            state.colorScheme = colors[Math.floor(Math.random() * colors.length)];
            
            syncControlsFromState();
            
            resetPath();
        }

        // --- GEOMETRY ENGINE ---

        // 1. ELLIPSE LUT BUILDER
        // Maps cumulative distance to position and normal angle
        function buildEllipseLUT() {
            const a = state.R;
            const b = state.R * 0.7; // Fixed Aspect Ratio
            const segments = 2000; // High res for smoothness
            const lut = [];
            let totalLen = 0;
            
            let prevX = a; // at theta = 0
            let prevY = 0;
            
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                const x = a * Math.cos(t);
                const y = b * Math.sin(t);
                
                if (i > 0) {
                    const dx = x - prevX;
                    const dy = y - prevY;
                    totalLen += Math.sqrt(dx*dx + dy*dy);
                }
                
                // Tangent angle
                // dx/dt = -a sin t, dy/dt = b cos t
                const tx = -a * Math.sin(t);
                const ty = b * Math.cos(t);
                const normalAngle = Math.atan2(ty, tx) - Math.PI/2; // Pointing Out
                
                lut.push({
                    dist: totalLen,
                    x: x,
                    y: y,
                    normal: normalAngle
                });
                
                prevX = x;
                prevY = y;
            }
            
            // Normalize distances to be uniform for O(1) lookup?
            // Actually, simpler: Resample into uniform distance steps
            const uniformLUT = [];
            const lookupSize = 1000;
            let currentDistIdx = 0;
            
            for (let j = 0; j <= lookupSize; j++) {
                const targetDist = (j / lookupSize) * totalLen;
                
                // Find point in raw lut
                while (currentDistIdx < lut.length - 1 && lut[currentDistIdx+1].dist < targetDist) {
                    currentDistIdx++;
                }
                
                const p1 = lut[currentDistIdx];
                const p2 = lut[currentDistIdx+1] || p1;
                
                // Interpolate
                let t = 0;
                const segLen = p2.dist - p1.dist;
                if (segLen > 0.0001) t = (targetDist - p1.dist) / segLen;
                
                uniformLUT.push({
                    x: p1.x + (p2.x - p1.x) * t,
                    y: p1.y + (p2.y - p1.y) * t,
                    normal: interpolateAngle(p1.normal, p2.normal, t)
                });
            }
            
            state.ellipseLUT = uniformLUT;
            state.ellipsePerimeter = totalLen;
        }
        
        function interpolateAngle(a1, a2, t) {
            // Handle wrap around -PI/PI
            let diff = a2 - a1;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a1 + diff * t;
        }

        function getPolyProps(shape, R) {
            let sides = 3;
            if (shape === 'square') sides = 4;
            if (shape === 'pentagon') sides = 5;
            if (shape === 'hexagon') sides = 6;
            if (shape === 'heptagon') sides = 7;
            if (shape === 'octagon') sides = 8;
            if (shape === 'diamond') sides = 4;
            const sideLen = 2 * R * Math.sin(Math.PI / sides);
            const apothem = R * Math.cos(Math.PI / sides);
            return { sides, sideLen, apothem };
        }

        // Core Function: Calculate State
        function calculateState(distance) {
            let rc = {x:0, y:0}; // Rotor Center
            let ra = 0;          // Rotor Angle
            
            // --- CIRCLE ---
            if (state.statorShape === 'circle') {
                const theta = distance / state.R; 
                if (state.mode === 'epitrochoid') {
                    rc.x = (state.R + state.r) * Math.cos(theta);
                    rc.y = (state.R + state.r) * Math.sin(theta);
                    ra = theta * (1 + state.R / state.r);
                } else {
                    rc.x = (state.R - state.r) * Math.cos(theta);
                    rc.y = (state.R - state.r) * Math.sin(theta);
                    ra = theta * (1 - state.R / state.r);
                }
            } 
            
            // --- ELLIPSE ---
            else if (state.statorShape === 'ellipse') {
                if (!state.ellipseLUT) buildEllipseLUT();
                
                // 1. Find Position and Normal on Stator
                let dMod = distance % state.ellipsePerimeter;
                if (dMod < 0) dMod += state.ellipsePerimeter;
                
                const lutIndex = (dMod / state.ellipsePerimeter) * (state.ellipseLUT.length - 1);
                const i = Math.floor(lutIndex);
                const t = lutIndex - i;
                const p1 = state.ellipseLUT[i];
                const p2 = state.ellipseLUT[i+1];
                
                // Interpolated Stator Point
                const sx = p1.x + (p2.x - p1.x) * t;
                const sy = p1.y + (p2.y - p1.y) * t;
                const normal = interpolateAngle(p1.normal, p2.normal, t);
                
                if (state.mode === 'epitrochoid') {
                    // Rotor Center: offset by r along normal
                    rc.x = sx + state.r * Math.cos(normal);
                    rc.y = sy + state.r * Math.sin(normal);
                    // Rotation: accumulated distance / r + orientation of contact point
                    ra = (distance / state.r) + normal;
                } else {
                    // Internal
                    rc.x = sx - state.r * Math.cos(normal);
                    rc.y = sy - state.r * Math.sin(normal);
                    ra = -(distance / state.r) + normal + Math.PI;
                }
            } 
            
            // --- TRACK (STADIUM) ---
            else if (state.statorShape === 'track') {
                // Geometry: Two semicircles radius r_bend, connected by straights length L
                const r_bend = state.R * 0.6;
                const L = state.R * 1.2;
                const perimeter = 2 * L + 2 * Math.PI * r_bend;
                
                let dMod = distance % perimeter;
                if (dMod < 0) dMod += perimeter;
                
                let sx, sy, normal;
                
                // Segment 1: Bottom Straight (R -> L)
                if (dMod < L) { 
                    sx = L/2 - dMod;
                    sy = r_bend;
                    normal = Math.PI/2; 
                } 
                // Segment 2: Left Arc (PI*r)
                else if (dMod < L + Math.PI * r_bend) { 
                    const ad = dMod - L;
                    const ang = Math.PI/2 + ad/r_bend;
                    sx = -L/2 + r_bend * Math.cos(ang);
                    sy = r_bend * Math.sin(ang);
                    normal = ang;
                } 
                // Segment 3: Top Straight (L -> R)
                else if (dMod < 2*L + Math.PI * r_bend) { 
                    const sd = dMod - (L + Math.PI*r_bend);
                    sx = -L/2 + sd;
                    sy = -r_bend;
                    normal = -Math.PI/2; // 3PI/2 is -PI/2
                } 
                // Segment 4: Right Arc
                else { 
                    const ad = dMod - (2*L + Math.PI*r_bend);
                    const ang = -Math.PI/2 + ad/r_bend;
                    sx = L/2 + r_bend * Math.cos(ang);
                    sy = r_bend * Math.sin(ang);
                    normal = ang;
                }
                
                if (state.mode === 'epitrochoid') {
                    rc.x = sx + state.r * Math.cos(normal);
                    rc.y = sy + state.r * Math.sin(normal);
                    ra = (distance / state.r) + normal;
                } else {
                    // Internal Track
                    rc.x = sx - state.r * Math.cos(normal);
                    rc.y = sy - state.r * Math.sin(normal);
                    ra = -(distance / state.r) + normal + Math.PI;
                }
            }

            // --- POLYGONS ---
            else {
                const props = getPolyProps(state.statorShape, state.R);
                const polyOffset = state.statorShape === 'diamond' ? Math.PI / 4 : 0;
                
                if (state.mode === 'epitrochoid') {
                    const cornerAngle = (2 * Math.PI) / props.sides;
                    const cornerArcLen = state.r * cornerAngle;
                    const totalSegmentLen = props.sideLen + cornerArcLen;
                    const perimeter = props.sides * totalSegmentLen;
                    
                    let distMod = distance % perimeter;
                    if (distMod < 0) distMod += perimeter;
                    
                    const segIndex = Math.floor(distMod / totalSegmentLen);
                    const segLocalDist = distMod % totalSegmentLen;
                    
                    const angleStep = (2 * Math.PI) / props.sides;
                    const angV1 = segIndex * angleStep + polyOffset; 
                    const angV2 = (segIndex + 1) * angleStep + polyOffset;
                    
                    const v1 = { x: state.R * Math.cos(angV1), y: state.R * Math.sin(angV1) };
                    const v2 = { x: state.R * Math.cos(angV2), y: state.R * Math.sin(angV2) };
                    const midAngle = (angV1 + angV2) / 2;
                    const normalV = { x: Math.cos(midAngle), y: Math.sin(midAngle) };
                    
                    if (segLocalDist < props.sideLen) {
                        const t = segLocalDist / props.sideLen;
                        const px = v1.x + (v2.x - v1.x) * t;
                        const py = v1.y + (v2.y - v1.y) * t;
                        rc.x = px + normalV.x * state.r;
                        rc.y = py + normalV.y * state.r;
                        ra = (distance / state.r) + midAngle;
                    } else {
                        const cornerLocalDist = segLocalDist - props.sideLen;
                        const currentArcAngle = (cornerLocalDist / cornerArcLen) * cornerAngle;
                        const currentNormalAngle = midAngle + currentArcAngle;
                        rc.x = v2.x + Math.cos(currentNormalAngle) * state.r;
                        rc.y = v2.y + Math.sin(currentNormalAngle) * state.r;
                        ra = (distance / state.r) + currentNormalAngle;
                    }
                } else {
                    // Internal Poly
                    const innerApothem = props.apothem - state.r;
                    const scale = innerApothem / props.apothem;
                    const perimeter = props.sides * props.sideLen * scale;
                    
                    const innerSideLen = props.sideLen * scale;
                    let distMod = distance % perimeter;
                    if (distMod < 0) distMod += perimeter;
                    
                    const segIndex = Math.floor(distMod / innerSideLen);
                    const t = (distMod % innerSideLen) / innerSideLen;
                    
                    const angleStep = (2 * Math.PI) / props.sides;
                    const angV1 = segIndex * angleStep + polyOffset;
                    const angV2 = (segIndex + 1) * angleStep + polyOffset;
                    
                    const R_in = state.R * scale;
                    const v1 = { x: R_in * Math.cos(angV1), y: R_in * Math.sin(angV1) };
                    const v2 = { x: R_in * Math.cos(angV2), y: R_in * Math.sin(angV2) };
                    
                    rc.x = v1.x + (v2.x - v1.x) * t;
                    rc.y = v1.y + (v2.y - v1.y) * t;
                    
                    const midAngle = (angV1 + angV2) / 2 + Math.PI; 
                    ra = -(distance / state.r) + midAngle;
                }
            }

            const pen = {
                x: rc.x + state.d * Math.cos(ra),
                y: rc.y + state.d * Math.sin(ra)
            };

            return { rc, ra, pen };
        }

        function drawStator(ctx) {
            ctx.beginPath();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            
            if (state.statorShape === 'circle') {
                ctx.arc(0, 0, state.R, 0, Math.PI * 2);
            } else if (state.statorShape === 'ellipse') {
                ctx.ellipse(0, 0, state.R, state.R * 0.7, 0, 0, Math.PI * 2);
            } else if (state.statorShape === 'track') {
                const r_bend = state.R * 0.6;
                const L = state.R * 1.2;
                // Draw Track: Two lines and two arcs
                // Right Arc
                ctx.arc(L/2, 0, r_bend, -Math.PI/2, Math.PI/2);
                // Bottom Line
                ctx.lineTo(-L/2, r_bend);
                // Left Arc
                ctx.arc(-L/2, 0, r_bend, Math.PI/2, 3*Math.PI/2);
                // Top Line
                ctx.lineTo(L/2, -r_bend);
            } else {
                const props = getPolyProps(state.statorShape, state.R);
                const angleStep = (2 * Math.PI) / props.sides;
                const offset = state.statorShape === 'diamond' ? Math.PI / 4 : 0;
                ctx.moveTo(state.R * Math.cos(offset), state.R * Math.sin(offset));
                for (let i = 1; i <= props.sides; i++) {
                    ctx.lineTo(state.R * Math.cos(i * angleStep + offset), state.R * Math.sin(i * angleStep + offset));
                }
            }
            ctx.stroke();
        }

        function drawRotor(ctx, rc, ra) {
            ctx.save();
            ctx.translate(rc.x, rc.y);
            ctx.rotate(ra);
            
            ctx.beginPath();
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 1;
            
            if (state.rotorShape === 'circle') {
                ctx.arc(0, 0, state.r, 0, Math.PI * 2);
            } else {
                let rsides = 3;
                if (state.rotorShape === 'square') rsides = 4;
                if (state.rotorShape === 'pentagon') rsides = 5;
                if (state.rotorShape === 'hexagon') rsides = 6;
                if (state.rotorShape === 'octagon') rsides = 8;
                const rStep = (2 * Math.PI) / rsides;
                
                ctx.moveTo(state.r, 0);
                for (let i = 1; i <= rsides; i++) {
                    ctx.lineTo(state.r * Math.cos(i * rStep), state.r * Math.sin(i * rStep));
                }
                ctx.stroke();
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(96, 165, 250, 0.3)';
                ctx.arc(0, 0, state.r, 0, Math.PI * 2);
            }
            
            ctx.stroke();
            ctx.fillStyle = 'rgba(96, 165, 250, 0.1)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.fillStyle = '#3b82f6';
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.moveTo(0, 0);
            ctx.lineTo(state.d, 0); 
            ctx.stroke();
            
            ctx.beginPath();
            ctx.fillStyle = '#ef4444';
            ctx.arc(state.d, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function getPathColor(index, total, scheme) {
            if (scheme === 'mono') return state.theme === 'dark' ? '#f5f5f7' : '#000000';
            if (scheme === 'classic') return state.mode === 'epitrochoid' ? '#2563eb' : '#db2777';
            
            let hue = 0;
            const p = (index % 2000) / 2000; 
            
            switch(scheme) {
                case 'rainbow': hue = (index * 0.2) % 360; break;
                case 'sunset': hue = 320 + p * 85; if(hue>360) hue-=360; break;
                case 'ocean': hue = 170 + p * 90; break;
                case 'neon': hue = (index * 0.8) % 360; break;
                case 'warm': hue = (index * 0.1) % 60; break;
                case 'grape': hue = 265 + p * 65; if (hue > 360) hue -= 360; break;
                case 'aurora': hue = 125 + p * 165; break;
                case 'fire': hue = (index * 0.12) % 55; break;
                case 'ice': hue = 190 + p * 35; break;
            }
            const saturation = ['neon', 'fire'].includes(scheme) ? '100%' : '80%';
            const lightness = scheme === 'ice' ? '58%' : '50%';
            return `hsl(${hue}, ${saturation}, ${lightness})`;
        }

        function clearPathLayer() {
            pathCtx.setTransform(1, 0, 0, 1, 0, 0);
            pathCtx.clearRect(0, 0, pathCanvas.width, pathCanvas.height);
            state.renderedPathIndex = 0;
            state.pathLayerDirty = false;
        }

        function markPathLayerDirty() {
            state.pathLayerDirty = true;
            state.renderedPathIndex = 0;
        }

        function setupPathLayerTransform() {
            pathCtx.setTransform(1, 0, 0, 1, 0, 0);
            pathCtx.scale(dpr, dpr);
            pathCtx.translate((pathCanvas.width / dpr) / 2, (pathCanvas.height / dpr) / 2);
            pathCtx.translate(state.panX, state.panY);
            pathCtx.scale(state.zoom, state.zoom);
            pathCtx.lineWidth = state.lineWidth;
            pathCtx.lineJoin = 'round';
            pathCtx.lineCap = 'round';
        }

        function drawPathRange(startIndex, endIndex) {
            if (endIndex <= 1 || startIndex >= endIndex) return;

            const points = state.pathPoints;
            const start = Math.max(1, startIndex);
            setupPathLayerTransform();

            if (['classic', 'mono'].includes(state.colorScheme)) {
                pathCtx.globalCompositeOperation = 'destination-over';
                pathCtx.beginPath();
                pathCtx.strokeStyle = getPathColor(0, 0, state.colorScheme);
                pathCtx.moveTo(points[start - 1].x, points[start - 1].y);
                for (let i = start; i < endIndex; i++) {
                    pathCtx.lineTo(points[i].x, points[i].y);
                }
                pathCtx.stroke();
            } else {
                pathCtx.globalCompositeOperation = 'source-over';
                const batch = 40;
                if (state.colorScheme === 'neon') {
                    pathCtx.shadowBlur = 6;
                }

                for (let i = start; i < endIndex; i += batch) {
                    pathCtx.beginPath();
                    pathCtx.strokeStyle = getPathColor(i, 0, state.colorScheme);
                    if (state.colorScheme === 'neon') pathCtx.shadowColor = pathCtx.strokeStyle;

                    pathCtx.moveTo(points[i - 1].x, points[i - 1].y);
                    const end = Math.min(i + batch, endIndex);
                    for (let j = i; j < end; j++) {
                        pathCtx.lineTo(points[j].x, points[j].y);
                    }
                    pathCtx.stroke();
                }

                pathCtx.shadowBlur = 0;
            }
            pathCtx.globalCompositeOperation = 'source-over';
        }

        function syncPathLayer() {
            if (state.pathLayerDirty) {
                clearPathLayer();
                drawPathRange(1, state.pathPoints.length);
                state.renderedPathIndex = state.pathPoints.length;
                return;
            }

            if (state.renderedPathIndex < state.pathPoints.length) {
                drawPathRange(state.renderedPathIndex, state.pathPoints.length);
                state.renderedPathIndex = state.pathPoints.length;
            }
        }

        function trimPathPointsForMemory() {
            if (state.pathPoints.length <= MAX_PATH_POINTS + PATH_TRIM_CHUNK) return;

            const removed = Math.min(PATH_TRIM_CHUNK, state.pathPoints.length - MAX_PATH_POINTS);
            state.pathPoints.splice(0, removed);

            // The visible path already lives on pathCanvas. Do not mark the layer dirty here,
            // or old strokes will be erased and the drawing will visibly jump.
            state.renderedPathIndex = Math.max(1, state.renderedPathIndex - removed);
        }

        function animate() {
            if (!state.isRunning) {
                drawFrame();
                requestAnimationFrame(animate);
                return;
            }

            const stepSize = 1.0; 
            const steps = Math.ceil(state.speed * 2);
            
            for(let i=0; i<steps; i++) {
                state.totalDistance += stepSize;
                const s = calculateState(state.totalDistance);
                state.pathPoints.push(s.pen);
            }
            
            trimPathPointsForMemory();

            drawFrame();
            requestAnimationFrame(animate);
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = state.theme === 'dark' ? '#0b0b0d' : '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const s = calculateState(state.totalDistance);
            syncPathLayer();
            
            ctx.save();
            ctx.scale(dpr, dpr);
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            ctx.translate(w/2, h/2);
            ctx.translate(state.panX, state.panY);
            ctx.scale(state.zoom, state.zoom);

            drawStator(ctx);
            ctx.restore();

            ctx.drawImage(pathCanvas, 0, 0);

            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.translate(w/2, h/2);
            ctx.translate(state.panX, state.panY);
            ctx.scale(state.zoom, state.zoom);

            drawRotor(ctx, s.rc, s.ra);
            ctx.restore();
        }
        
        function generateInstant() {
            state.pathPoints = [];
            state.totalDistance = 0;
            clearPathLayer();
            
            // Estimation
            let maxDist = 0;
            if (['circle', 'ellipse', 'track'].includes(state.statorShape)) {
                 maxDist = 2 * Math.PI * state.R * 60; 
            } else {
                const p = getPolyProps(state.statorShape, state.R);
                maxDist = p.sides * p.sideLen * 60; 
            }
            
            const limit = 40000;
            const actualStep = maxDist / limit > 1.0 ? maxDist / limit : 1.0;
            
            for (let d = 0; d < maxDist; d += actualStep) {
                const s = calculateState(d);
                state.pathPoints.push(s.pen);
            }
            
            state.totalDistance = maxDist;
            state.isRunning = false;
            markPathLayerDirty();
            drawFrame();
        }

        function createArtworkImageDataUrl(maxWidth = canvas.width / dpr) {
            syncPathLayer();

            const sourceWidth = canvas.width;
            const sourceHeight = canvas.height;
            const scale = Math.min(1, (maxWidth * dpr) / sourceWidth);
            const outCanvas = document.createElement('canvas');
            outCanvas.width = Math.max(1, Math.round(sourceWidth * scale));
            outCanvas.height = Math.max(1, Math.round(sourceHeight * scale));
            const outCtx = outCanvas.getContext('2d');

            outCtx.fillStyle = state.theme === 'dark' ? '#0b0b0d' : '#ffffff';
            outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            outCtx.drawImage(pathCanvas, 0, 0, outCanvas.width, outCanvas.height);
            return outCanvas.toDataURL('image/png');
        }

        function takeSnapshot() {
            const link = document.createElement('a');
            link.download = `spinning-drawer-${Date.now()}.png`;
            link.href = createArtworkImageDataUrl();
            link.click();
        }

        function saveToHistory() {
            if (state.pathPoints.length < 50) return;

            const {
                history,
                pathPoints,
                ellipseLUT,
                ellipsePerimeter,
                renderedPathIndex,
                pathLayerDirty,
                isRunning,
                isPanning,
                panStartX,
                panStartY,
                panOriginX,
                panOriginY,
                totalDistance,
                ...config
            } = state;
            const record = {
                id: Date.now(),
                img: createArtworkImageDataUrl(720),
                config
            };
            
            state.history.unshift(record);
            state.history = state.history.slice(0, MAX_HISTORY_ITEMS);
            persistHistoryToStorage();
            updateHistoryUI();
        }

        function updateHistoryUI() {
            if (state.history.length === 0) {
                historyContainer.innerHTML = `<div class="history-empty">${t('emptyHistory')}</div>`;
                return;
            }
            historyContainer.innerHTML = state.history.map(h => `
                <div class="history-card" onclick="loadHistory(${h.id})">
                    <img src="${h.img}" alt="Saved drawing preview">
                    <div class="history-card-meta">
                        ${h.config.statorShape} / ${h.config.rotorShape}
                    </div>
                </div>
            `).join('');
        }

        window.loadHistory = function(id) {
            const h = state.history.find(x => x.id === id);
            if (!h) return;
            
            const { R, r, d, mode, statorShape, rotorShape, colorScheme, lineWidth = 1.5, zoom = 1, panX = 0, panY = 0 } = h.config;
            state.R = R; state.r = r; state.d = d;
            state.mode = mode;
            state.statorShape = statorShape;
            state.rotorShape = rotorShape;
            state.colorScheme = colorScheme;
            state.lineWidth = lineWidth;
            state.zoom = zoom;
            state.panX = panX;
            state.panY = panY;
            
            syncControlsFromState();
            
            if (statorShape === 'ellipse') buildEllipseLUT();
            setMode(mode); 
            state.isRunning = true;
        };

        function clearHistory() {
            state.history = [];
            persistHistoryToStorage();
            updateHistoryUI();
        }

        // First run
        if (state.statorShape === 'ellipse') buildEllipseLUT();
        init();
    </script>
</body>
</html>
